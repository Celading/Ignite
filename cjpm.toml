[package]
  cjc-version = "1.0.0"
  version = "0.8.17"
  name = "ignite"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  description = "Ignite - A high-performance web framework for Cangjie, inspired by Fiber"
  include = ["src","README.md","LICENSE"]
  exclude = [
    "manual",
    "testdata",
    "src/tests",
    "src/banner_render_test.cj",
    "src/inproc_test_port_internal_test.cj",
    "src/io_driver_http_probe_catalog_internal_test.cj",
    "src/server_engine_legacy_closeout_diagnostics.cj",
    "src/server_engine_legacy_runtime_concurrency_gates.cj",
    "src/server_engine_legacy_default_flip_gates_01.cj",
    "src/server_engine_legacy_default_flip_gates_02.cj",
    "src/server_engine_legacy_default_path_gates_01.cj",
    "src/server_engine_legacy_default_path_gates_02.cj",
    "src/server_engine_legacy_default_path_gates_03.cj",
    "src/server_engine_legacy_default_path_gates_04.cj",
    "src/server_socket_app_dispatch_plan_internal_test.cj",
    "src/server_socket_engine_shell_internal_test.cj",
    "src/server_socket_http1_dispatch_seed_internal_test.cj",
    "src/stream_protocol_internal_test.cj",
    "src/client/native_h1_client_internal_test.cj",
    "src/client/native_tls_h1_wire_internal_test.cj",
    "src/client/native_tls_h2_wire_internal_test.cj",
    "src/client/native_tls_pool_pressure_internal_test.cj",
    "src/client/transport_error_internal_test.cj",
    "src/native_h2/client_multiplex_internal_test.cj",
    "src/native_h2/client_runtime_internal_test.cj",
    "src/native_h2/request_semantics_internal_test.cj",
    "src/native_h2/runtime_internal_test.cj",
    "src/native_h2/server_drain_internal_test.cj",
    "src/native_h2/server_streaming_internal_test.cj",
    "src/native_h2/settings_internal_test.cj",
    "src/native_tls/client_transport_internal_test.cj",
    "src/native_tls/protocol_selection_internal_test.cj"
  ]

[package.package-configuration."ignite.middleware"]
  output-type = "static"

[package.package-configuration."ignite.client"]
  output-type = "static"

[package.package-configuration."ignite.governance"]
  output-type = "static"

[package.package-configuration."ignite.security"]
  output-type = "static"

[package.package-configuration."ignite.binary"]
  output-type = "static"

[dependencies]
  # Hosted dependencies keep the Git preview reproducible until matching center
  # repository versions become publicly resolver-visible.
  jinguissl = { git = "https://gitcode.com/cinyu/jinguiSSL.git" }
  seajson = { git = "https://gitcode.com/CjKu/SeaJson.git" }
  lisi = { git = "https://gitcode.com/cinyu/lisi.git", branch = "lio-j002-provider-contract-v1" }

[target.x86_64-w64-mingw32]
  link-option = "-lcrypt32"
  compile-option = "--cfg \"ohos=false\""
  [target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/windows_x86_64_cjnative/static/stdx"]
  [target.x86_64-w64-mingw32-Deprecated.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/cj_stdx_x86_64-w64-mingw32/static/stdx"]

[target.aarch64-apple-darwin]
  [target.aarch64-apple-darwin.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/cj_stdx_darwin_aarch64_llvm/static/stdx"]

[target.x86_64-apple-darwin]
  [target.x86_64-apple-darwin.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/cj_stdx_darwin_x86_64_llvm/static/stdx"]

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_x86_64_llvm/static/stdx"]

[target.aarch64-unknown-linux-gnu]
  [target.aarch64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_aarch64_llvm/static/stdx"]

[target.aarch64-linux-ohos]
  compile-option = "-B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\""

[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}/linux_ohos_aarch64_cjnative/static/stdx"]

[target.aarch64-linux-ohos-cjnative]
  [target.aarch64-linux-ohos-cjnative.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}/linux_ohos_aarch64_cjnative/static/stdx"]
